# ARCHIVED — old generation. Runs on the 200-node ogbn-only test set, which
# docs/adapter.md (Stage 1) records as superseded: those nodes span out-degree
# 1-65 in the joint graph and are not comparable with the current 495-node set.
run: cosine-mean-60
condition: vicuna-7b, references filtered by cosine_score_mean
status: archived

generation:
  script: src/generation/generate_filtered.py
  llm: lmsys/vicuna-7b-v1.5
  filter_metric: cosine_score_mean
  filter_threshold: 0.560702
  retention_target: 60%      # threshold picked in notebooks/filters/cosine_filter_thresholds.ipynb
  max_new_tokens: 256
  max_length: 4096

data:
  nodes: data/processed/ogbn_subset/nodes_subset.csv   # 1,936 nodes, 200 with is_test=1
  edges: data/processed/ogbn_subset/edges_subset.csv   # 2,100 edges, carries the filter columns

scoring:
  metrics: [rouge1_f, rouge2_f, rougeL_f, bertscore_p, bertscore_r, bertscore_f1]
  llm_judge:
    model: gpt-5.4-mini
    scores: [llm_accuracy, llm_coherence, llm_language]

results:
  rows: 200
  error_rows: 16
